task_defaults:
  git_options:
    submodules:
      include_match: ^.*$
  max_trials: 1
tasks:
  git-branch-current:
    name: 'git: tree contains latest commit from origin/master'
    aggregate_state: satisfy-last
    scripts:
      test:
        body: |
          #!/usr/bin/env bash
          set -euo pipefail
          set -x

          git fetch origin master
          CMT_ID=$(git rev-parse origin/master)

          set +o pipefail
          git rev-list --children HEAD | grep -q $CMT_ID

          echo "OK"
